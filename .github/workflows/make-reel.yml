name: make-reel

on:
  workflow_dispatch:
    inputs:
      id:
        description: "動画の識別名(商品ID)"
        required: true
      image1:
        required: true
      image2:
        required: true
      image3:
        required: true
      text1:
        required: true
      text2:
        required: true
      text3:
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 準備(動画ツールと日本語フォント)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fontconfig fonts-noto-cjk

      - name: 画像をダウンロード
        env:
          I1: ${{ inputs.image1 }}
          I2: ${{ inputs.image2 }}
          I3: ${{ inputs.image3 }}
        run: |
          curl -fsSL --retry 3 -o img1.jpg "$I1"
          curl -fsSL --retry 3 -o img2.jpg "$I2"
          curl -fsSL --retry 3 -o img3.jpg "$I3"

      - name: 動画を作る
        env:
          T1: ${{ inputs.text1 }}
          T2: ${{ inputs.text2 }}
          T3: ${{ inputs.text3 }}
          LANG: C.UTF-8
        run: |
          FONT="$(fc-match -f '%{file}' 'Noto Sans CJK JP:bold')"
          i=1
          ARGS=()
          FILTER=""
          # 1行目の文字色(1枚目=黄色の見出し、2枚目=白、3枚目=黄色の呼びかけ)
          COLORS=("FFE14D" "FFFFFF" "FFE14D")
          for T in "$T1" "$T2" "$T3"; do
            L1="${T%%$'\n'*}"
            L2=""
            if [[ "$T" == *$'\n'* ]]; then L2="${T#*$'\n'}"; fi
            printf '%s' "$L1" > "t$i.a.txt"
            printf '%s' "$L2" > "t$i.b.txt"
            # 行ごとに、画面の幅に収まる最大の文字サイズにする(30〜64)
            N1=${#L1}; N2=${#L2}
            FA=$((640/(N1>0?N1:1))); [ $FA -gt 64 ] && FA=64; [ $FA -lt 30 ] && FA=30
            FB=$((640/(N2>0?N2:1))); [ $FB -gt 64 ] && FB=64; [ $FB -lt 30 ] && FB=30
            ARGS+=(-i "img$i.jpg")
            FILTER+="[$((i-1)):v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.0008,1.12)':d=100:x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':s=720x1280:fps=25,"
            # 文字が読みやすいよう、中央の帯をうすく暗くする
            FILTER+="drawbox=x=0:y=ih*0.47:w=iw:h=ih*0.20:color=black@0.30:t=fill,"
            C1="${COLORS[$((i-1))]}"
            if [ -n "$L2" ]; then
              TOT=$((FA+FB+14)); YA=$((730-TOT/2)); YB=$((YA+FA+14))
              FILTER+="drawtext=fontfile='$FONT':textfile=t$i.a.txt:fontsize=$FA:fontcolor=0x$C1:borderw=4:bordercolor=black@0.9:x=(w-text_w)/2:y=$YA,"
              FILTER+="drawtext=fontfile='$FONT':textfile=t$i.b.txt:fontsize=$FB:fontcolor=white:borderw=4:bordercolor=black@0.9:x=(w-text_w)/2:y=$YB,"
            else
              FILTER+="drawtext=fontfile='$FONT':textfile=t$i.a.txt:fontsize=$FA:fontcolor=0x$C1:borderw=4:bordercolor=black@0.9:x=(w-text_w)/2:y=h*0.57-text_h/2,"
            fi
            FILTER+="setsar=1[v$i];"
            i=$((i+1))
          done
          ffmpeg -y -loglevel error "${ARGS[@]}" -filter_complex "${FILTER}[v1][v2][v3]concat=n=3:v=1:a=0,format=yuv420p[v]" -map "[v]" -r 25 -c:v libx264 -preset medium -crf 23 -movflags +faststart reel.mp4
          ls -la reel.mp4

      - name: BGMを付ける
        env:
          ID: ${{ inputs.id }}
        run: |
          shopt -s nullglob
          FILES=(bgm/*.mp3)
          N=${#FILES[@]}
          if [ "$N" -eq 0 ]; then echo "BGMなし"; exit 0; fi
          NUM=$(echo "$ID" | tr -dc '0-9')
          IDX=$(( 10#${NUM:-0} % N ))
          BGM="${FILES[$IDX]}"
          echo "使うBGM: $BGM ($N曲中)"
          ffmpeg -y -loglevel error -i reel.mp4 -i "$BGM" -filter_complex "[1:a]silenceremove=start_periods=1:start_threshold=-50dB,atrim=0:12,asetpts=PTS-STARTPTS,loudnorm=I=-18:TP=-2:LRA=11,afade=t=in:st=0:d=0.5,afade=t=out:st=10:d=2,atrim=0:12[a]" -map 0:v -map "[a]" -c:v copy -c:a aac -b:a 128k -ar 44100 -shortest reel_bgm.mp4
          mv reel_bgm.mp4 reel.mp4
          ls -la reel.mp4

      - name: 公開URLに保存
        env:
          ID: ${{ inputs.id }}
        run: |
          mkdir -p videos
          cp reel.mp4 "videos/$ID.mp4"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add "videos/$ID.mp4"
          git commit -m "video $ID"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/videos/$ID.mp4"
